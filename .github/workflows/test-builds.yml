# Builds test versions of CozyMoon every time main changes:
#  - a web preview on GitHub Pages (open it in any phone or computer browser)
#  - an Android APK attached to the "Test build" release (install it on a phone)
# Nothing here publishes to Google Play.
name: Test builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # update the "Test build" release
  pages: write      # publish the web preview
  id-token: write

concurrency:
  group: test-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the debug key, which is fine for installing on your own phone.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk cozymoon-test.apk
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build
          prerelease: true
          make_latest: false
          body: |
            Latest test version of CozyMoon, built from `${{ github.sha }}`.
            To install on an Android phone, open this page on the phone, tap
            **cozymoon-test.apk**, and follow docs/install-on-phone.md.
          files: cozymoon-test.apk
